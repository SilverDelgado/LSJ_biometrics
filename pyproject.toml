[project]
name = "lsj-biometrics"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "torch>=2.7",
    "torchvision>=0.22",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
mtcnn = ["mtcnn>=1.0.0", "tensorflow-cpu>=2.16"]
onvif = ["onvif-zeep>=0.2.12"]
dev = ["httpx>=0.27", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsj_biometrics"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
